<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">
<title>IRAQ EMPIRE CINEMA | مشاهدة</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#060606;color:#fff;font-family:Arial,"Tahoma",sans-serif}body{min-height:100vh}.page{min-height:100vh;background:radial-gradient(circle at 75% 0,rgba(139,0,0,.28),transparent 35%),#060606}.top{height:72px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(6,6,6,.8);backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}.brand{font-weight:900;letter-spacing:1px}.brand small{display:block;color:#b99b55;font-size:10px;letter-spacing:3px;margin-top:3px}.actions{display:flex;gap:8px}.back,.favorite{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:10px 15px;border-radius:12px;background:#0d0d0d;cursor:pointer}.favorite.active{background:#b89245;color:#080808}.hero{min-height:430px;padding:60px 6%;display:flex;align-items:flex-end;gap:35px;background-size:cover;background-position:center;position:relative}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,6,6,.98) 15%,rgba(6,6,6,.75) 48%,rgba(6,6,6,.35)),linear-gradient(0deg,#060606,transparent 45%)}.poster,.info{position:relative;z-index:1}.poster{width:210px;aspect-ratio:2/3;object-fit:cover;border-radius:18px;box-shadow:0 20px 70px #000}.info{max-width:850px}.type{color:#d7b76a;font-size:13px;font-weight:bold}.title{font-size:clamp(34px,5vw,68px);margin:10px 0}.overview{color:#c5c5c5;line-height:1.9;max-width:800px}.meta{display:flex;gap:15px;flex-wrap:wrap;color:#aaa}.watch-btn{display:inline-block;background:#b89245;color:#090909;font-weight:900;padding:14px 22px;border-radius:12px;text-decoration:none;margin-top:15px}.content{padding:35px 6%}.section-title{font-size:26px;margin:0 0 18px}.seasons{display:flex;gap:10px;overflow:auto;margin-bottom:22px}.season{border:1px solid rgba(255,255,255,.12);background:#111;color:#fff;padding:11px 17px;border-radius:11px;cursor:pointer}.season.active{background:#b89245;color:#080808}.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.episode{background:#101010;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}.episode img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#181818}.episode-body{padding:14px}.episode-title{font-weight:800}.episode-info{font-size:12px;color:#999;margin:7px 0 12px}.play{display:block;text-align:center;background:#b89245;color:#080808;text-decoration:none;font-weight:900;padding:10px;border-radius:10px;border:0;width:100%;cursor:pointer}.episode-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{background:#191919;color:#fff}.empty{padding:30px;border:1px dashed rgba(255,255,255,.15);border-radius:15px;color:#999;text-align:center}.player{display:none;margin-top:25px;background:#000;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}.player iframe,.player video{width:100%;aspect-ratio:16/9;border:0;display:block}.player-head{padding:13px 16px;background:#101010;display:flex;justify-content:space-between;gap:10px}.player-controls{display:flex;gap:8px;padding:12px;background:#0b0b0b}.close,.nav-episode{cursor:pointer;color:#ddd;border:1px solid rgba(255,255,255,.1);background:#151515;padding:8px 12px;border-radius:9px}.continue{margin:0 0 30px;padding:18px;background:#0e0e0e;border:1px solid rgba(255,255,255,.08);border-radius:15px}.continue strong{display:block;margin-bottom:7px}.progress-bar{height:5px;background:#222;border-radius:5px;overflow:hidden;margin-top:12px}.progress-fill{height:100%;background:#b89245;width:0}.providers{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.provider{background:#111;border:1px solid rgba(255,255,255,.1);padding:9px 12px;border-radius:10px;color:#ddd;font-size:12px}.source-select{margin-top:10px;background:#111;color:#fff;border:1px solid rgba(255,255,255,.12);padding:9px;border-radius:9px;width:100%}@media(max-width:700px){.hero{padding:35px 5%;align-items:center}.poster{width:130px}.title{font-size:34px}.hero:after{background:linear-gradient(90deg,rgba(6,6,6,.94),rgba(6,6,6,.6)),linear-gradient(0deg,#060606,transparent)}.actions{flex-wrap:wrap}.back,.favorite{padding:8px 10px}}
</style>
</head>
<body>
<div class="page">
<header class="top"><div class="brand">IRAQ EMPIRE <small>CINEMA</small></div><div class="actions"><button id="favorite" class="favorite">♡ المفضلة</button><a class="back" href="/">العودة للمكتبة</a></div></header>
<section id="hero" class="hero"><img id="poster" class="poster" alt=""><div class="info"><div id="type" class="type">محتوى</div><h1 id="title" class="title">جاري التحميل...</h1><div id="meta" class="meta"></div><p id="overview" class="overview"></p><div id="direct"></div><div id="providers" class="providers"></div></div></section>
<main class="content">
<section id="continue" class="continue" hidden><strong>متابعة المشاهدة</strong><span id="continueText"></span><div class="progress-bar"><div id="continueFill" class="progress-fill"></div></div></section>
<section id="seasonSection" hidden><h2 class="section-title">المواسم والحلقات</h2><div id="seasons" class="seasons"></div><div id="episodes" class="episodes"></div></section>
<section id="chapterSection" hidden><h2 class="section-title">الفصول</h2><div id="chapters" class="episodes"></div></section>
<section id="empty" class="empty" hidden>لا توجد حلقات أو فصول أو مصادر مشاهدة حقيقية لهذا العمل حاليًا.</section>
<div id="player" class="player"><div class="player-head"><strong id="playerTitle">المشاهدة</strong><span class="close" id="closePlayer">إغلاق</span></div><div id="playerBody"></div><div class="player-controls"><button id="prevEpisode" class="nav-episode">السابق</button><button id="nextEpisode" class="nav-episode">التالي</button></div></div>
</main>
</div>
<script>
const params=new URLSearchParams(location.search);const id=params.get('id');
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const PREFIX='iraq-empire-cinema:';let data=null,currentSeason=0,currentEpisodeIndex=-1,currentSource=null;
const key=(season,episode)=>`${PREFIX}progress:${encodeURIComponent(String(id))}:${encodeURIComponent(String(season))}:${encodeURIComponent(String(episode))}`;
const favKey=`${PREFIX}favorite:${encodeURIComponent(String(id||''))}`;
function getProgress(k){try{const v=JSON.parse(localStorage.getItem(k)||'null');if(!v||!Number.isFinite(v.position)||!Number.isFinite(v.duration)||v.duration<=0)return null;return v}catch{return null}}
function setProgress(k,p,d){if(!Number.isFinite(p)||p<0||!Number.isFinite(d)||d<=0)return;localStorage.setItem(k,JSON.stringify({position:p,duration:d,updatedAt:Date.now()}))}
function sourceButton(source,label){if(!source?.url)return '';return `<button class="play direct-source" data-url="${esc(source.url)}" data-embed="${source.embed?'1':'0'}">${esc(label||'مشاهدة الآن')}</button>`}
function showPlayer(source,title,episodeRef){if(!source?.url)return;currentSource=source;$('#playerTitle').textContent=title||'المشاهدة';const body=$('#playerBody');body.innerHTML='';if(source.embed){const iframe=document.createElement('iframe');iframe.src=source.url;iframe.allow='autoplay; fullscreen; picture-in-picture';iframe.allowFullscreen=true;body.appendChild(iframe)}else{const link=document.createElement('a');link.href=source.url;link.target='_blank';link.rel='noopener noreferrer';link.className='play';link.style.margin='30px';link.textContent='فتح مصدر المشاهدة';body.appendChild(link)}$('#player').style.display='block';if(episodeRef)saveContinue(episodeRef.season,episodeRef.index);$('#player').scrollIntoView({behavior:'smooth',block:'center'})}
function saveContinue(season,index){const episodes=data?.item?.seasons?.[season]?.episodes||[];const e=episodes[index];if(!e)return;const pkey=key(data.item.seasons[season].number,e.number);const old=getProgress(pkey);if(!old)setProgress(pkey,0,100);renderContinue(season,index)}
function renderContinue(season,index){const s=data.item.seasons[season],e=s?.episodes?.[index];if(!e)return;const p=getProgress(key(s.number,e.number));$('#continue').hidden=false;$('#continueText').textContent=`الموسم ${s.number} • الحلقة ${e.number} — ${e.title||''}`;$('#continueFill').style.width=p?`${Math.min(100,(p.position/p.duration)*100)}%`:'0%'}
function renderSeasons(){const seasons=data.item.seasons||[];if(!seasons.length)return;$('#seasonSection').hidden=false;currentSeason=Math.min(currentSeason,seasons.length-1);$('#seasons').innerHTML=seasons.map((s,i)=>`<button class="season ${i===currentSeason?'active':''}" data-i="${i}">الموسم ${s.number}</button>`).join('');$$('.season').forEach(b=>b.onclick=()=>{currentSeason=Number(b.dataset.i);renderSeasons()});const season=seasons[currentSeason];$('#episodes').innerHTML=(season.episodes||[]).map((e,i)=>{const src=e.sources?.[0];const p=getProgress(key(season.number,e.number));const pct=p?Math.min(100,(p.position/p.duration)*100):0;return `<article class="episode"><img src="${esc(e.thumbnail||'')}" alt=""><div class="episode-body"><div class="episode-title">${esc(e.number)}. ${esc(e.title)}</div><div class="episode-info">${esc(e.releaseDate||'')}${e.duration?' • '+esc(e.duration)+' دقيقة':''}${pct?' • '+Math.round(pct)+'%':''}</div>${src?`<button class="play ep" data-index="${i}">${pct?'متابعة الحلقة':'مشاهدة الحلقة'}</button>`:'<div class="episode-info">المصدر غير متوفر حاليًا</div>'}</div></article>`}).join('');$$('.ep').forEach(b=>b.onclick=()=>{currentEpisodeIndex=Number(b.dataset.index);const e=season.episodes[currentEpisodeIndex];showPlayer(e?.sources?.[0],`${data.item.title} — الحلقة ${e.number}`,{season:currentSeason,index:currentEpisodeIndex});})}
function renderChapters(){const chapters=data.item.chapters||[];if(!chapters.length)return;$('#chapterSection').hidden=false;$('#chapters').innerHTML=chapters.map(c=>`<article class="episode"><div class="episode-body"><div class="episode-title">الفصل ${esc(c.number)} — ${esc(c.title)}</div><div class="episode-info">${esc(c.releaseDate||'')}</div>${c.sources?.[0]?sourceButton(c.sources[0],'فتح الفصل'):'<div class="episode-info">المصدر غير متوفر حاليًا</div>'}</div></article>`).join('')}
function renderFavorite(){const active=localStorage.getItem(favKey)==='1';$('#favorite').classList.toggle('active',active);$('#favorite').textContent=active?'♥ في المفضلة':'♡ المفضلة'}
function renderProviders(){const providers=data.providers||[];if(!providers.length)return;$('#providers').innerHTML=providers.slice(0,8).map(p=>`<span class="provider">${esc(p.name||p.provider_name||'مزود مشاهدة')}${p.type?' • '+esc(p.type):''}</span>`).join('')}
async function init(){if(!id){location.href='/';return}try{const r=await fetch(`/api/title?id=${encodeURIComponent(id)}&region=IQ`,{cache:'no-store'});data=await r.json();if(!r.ok||!data.success)throw Error(data.error||'error');const item=data.item;$('#title').textContent=item.title||'بدون عنوان';$('#type').textContent={movie:'فيلم',series:'مسلسل',tv:'مسلسل',anime:'أنمي'}[item.type]||'محتوى';$('#overview').textContent=item.overview||'لا يوجد وصف متاح.';$('#poster').src=item.poster||item.image||'';$('#hero').style.backgroundImage=`url("${(item.backdrop||item.banner||item.poster||'').replace(/"/g,'')}")`;$('#meta').innerHTML=`<span>⭐ ${esc(item.rating||'—')}</span><span>${esc(item.year||'—')}</span><span>${esc((item.genres||[]).slice(0,4).join(' • '))}</span>`;if(data.watch.movie?.[0])$('#direct').innerHTML=sourceButton(data.watch.movie[0],'مشاهدة الآن');renderProviders();renderFavorite();renderSeasons();renderChapters();if(data.meta?.hasEpisodeSources&&data.item.seasons?.length){for(let si=0;si<data.item.seasons.length;si++){const s=data.item.seasons[si];for(let ei=0;ei<(s.episodes||[]).length;ei++){if(getProgress(key(s.number,s.episodes[ei].number))){renderContinue(si,ei);break}}if(!$('#continue').hidden)break}}if(!data.watch.available)$('#empty').hidden=false;bindSourceButtons()}catch(e){$('#title').textContent='تعذر تحميل المحتوى';$('#overview').textContent=e.message||'حدث خطأ غير متوقع.'}}
function bindSourceButtons(){$$('.direct-source').forEach(b=>b.onclick=()=>showPlayer({url:b.dataset.url,embed:b.dataset.embed==='1'},`${data.item.title}`))}
$('#favorite').onclick=()=>{if(localStorage.getItem(favKey)==='1')localStorage.removeItem(favKey);else localStorage.setItem(favKey,'1');renderFavorite()};
$('#prevEpisode').onclick=()=>moveEpisode(-1);$('#nextEpisode').onclick=()=>moveEpisode(1);
function moveEpisode(direction){if(currentEpisodeIndex<0||!data?.item?.seasons?.[currentSeason])return;const list=data.item.seasons[currentSeason].episodes||[];const next=currentEpisodeIndex+direction;if(next<0||next>=list.length)return;currentEpisodeIndex=next;const e=list[next];showPlayer(e.sources?.[0],`${data.item.title} — الحلقة ${e.number}`,{season:currentSeason,index:next});renderSeasons()}
$('#closePlayer').onclick=()=>{$('#player').style.display='none';$('#playerBody').innerHTML=''};
init();
</script>
</body>
</html>
